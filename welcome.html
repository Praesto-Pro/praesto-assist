<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Checkout status | Praesto Assist Agent</title><script>try{const t=localStorage.getItem('praesto-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch{}</script><link rel="stylesheet" href="/styles.css"/></head><body class="policy-body"><main class="policy-page"><a href="/" class="policy-back">← Praesto Assist Agent</a><div class="eyebrow">CHECKOUT STATUS</div><h1 id="status-title">Checking your subscription status...</h1><p id="status-copy">Subscription activation happens after payment is verified and the required enrollment checks are complete. A checkout redirect by itself does not activate a membership.</p><a class="button button-primary" href="/">Back to Praesto Assist Agent ↗</a></main><script>const s=new URLSearchParams(location.search).get('session_id');if(!s){document.querySelector('#status-title').textContent='No checkout session supplied.';}else{fetch('/api/checkout-status?session_id='+encodeURIComponent(s)).then(r=>r.json().then(d=>({ok:r.ok,d}))).then(({ok,d})=>{document.querySelector('#status-title').textContent=ok&&d.payment_status==='paid'?'Payment recorded. Enrollment comes next.':ok?'Checkout received. Payment verification is pending.':'We cannot verify this checkout yet.';document.querySelector('#status-copy').textContent=ok&&d.payment_status==='paid'?'Your subscription payment was recorded by Stripe. Praesto will verify eligibility and provide the supported onboarding process. No devices have been enrolled automatically.':'A redirect does not confirm active service. If you completed payment, check your Stripe confirmation and contact Praesto if you need help.';}).catch(()=>{document.querySelector('#status-title').textContent='Unable to check checkout status right now.';});}</script></body></html>
